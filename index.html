<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>38-0 欧冠版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c17;--card:#131a2e;--card2:#1b2440;--gold:#f5c542;--blue:#00d4ff;--green:#22d67a;--red:#ff4d6d;--text:#e8eef8;--muted:#7b88a8;--yellow:#ffd93d}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at top,#101a35 0%,#080c17 60%);color:var(--text);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
#app{max-width:1200px;margin:0 auto}
.header{text-align:center;padding:12px 0 20px}
.header h1{font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--gold),#fff,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.header p{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:1px}
.panel{background:var(--card);border:1px solid #22304f;border-radius:16px;padding:20px;margin-bottom:16px}
.panel h2{font-size:16px;color:var(--gold);margin-bottom:14px;letter-spacing:1px}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;max-height:220px;overflow-y:auto;padding-right:6px}
.years::-webkit-scrollbar{width:6px}.years::-webkit-scrollbar-thumb{background:#2a3a5e;border-radius:3px}
.year-btn{background:var(--card2);border:2px solid #2a3a5e;border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;font-weight:800;font-size:14px;transition:.15s;color:var(--text);font-family:inherit}
.year-btn:hover{border-color:var(--blue)}.year-btn.active{border-color:var(--gold);background:#1f2a4a}
.formations{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.form-card{background:var(--card2);border:2px solid #2a3a5e;border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;transition:.2s}
.form-card:hover{border-color:var(--blue);transform:translateY(-3px)}.form-card.active{border-color:var(--gold);background:#1f2a4a}
.form-card .name{font-size:15px;font-weight:800;letter-spacing:1px}
.form-card .desc{font-size:10px;color:var(--muted);margin-top:4px}
.diffs{display:flex;gap:10px;flex-wrap:wrap}
.diff-btn{flex:1;min-width:100px;background:var(--card2);border:2px solid #2a3a5e;border-radius:10px;padding:12px;cursor:pointer;transition:.2s;text-align:center}
.diff-btn:hover{border-color:var(--blue)}.diff-btn.active{border-color:var(--gold);background:#1f2a4a}
.diff-btn .t{font-weight:700;font-size:14px}.diff-btn .d{font-size:10px;color:var(--muted);margin-top:4px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer;transition:.2s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--blue),#0091ff);color:#001428;box-shadow:0 6px 24px rgba(0,212,255,.3)}
.btn-primary:hover{transform:translateY(-2px)}.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),#e0a800);color:#1a1200;box-shadow:0 6px 24px rgba(245,197,66,.3)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;border:2px solid #2a3a5e;color:var(--text)}.btn-ghost:hover{border-color:var(--blue)}.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.game-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:820px){.game-layout{grid-template-columns:1fr}}
.pitch{position:relative;width:100%;aspect-ratio:3/4;background:repeating-linear-gradient(180deg,#1a5c2e 0px,#1a5c2e 40px,#1d6633 40px,#1d6633 80px);border-radius:12px;border:3px solid #0d3318;overflow:hidden}
.pitch::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 58px,rgba(255,255,255,.25) 58px,rgba(255,255,255,.25) 60px,transparent 60px),linear-gradient(180deg,transparent calc(50% - 1px),rgba(255,255,255,.25) 50%,transparent calc(50% + 1px));pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;border:2px dashed rgba(255,255,255,.4);background:rgba(0,0,0,.3);font-size:10px;color:rgba(255,255,255,.7)}
.slot.filled{border:2px solid var(--gold);background:rgba(0,0,0,.75);box-shadow:0 0 16px rgba(245,197,66,.5)}
.slot.filled .num{font-size:16px;font-weight:900;color:var(--gold)}
.slot.filled .nm{font-size:9px;color:#fff;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .pos-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.5)}
.wheel-box{background:var(--card2);border-radius:14px;padding:20px;text-align:center;border:1px solid #2a3a5e;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.wheel-team{font-size:24px;font-weight:900;color:var(--gold);letter-spacing:1px}
.wheel-season{font-size:14px;color:var(--muted);margin-top:6px}.wheel-flag{font-size:38px;margin-bottom:8px}
.spinning{animation:shake .1s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(2px,3px)}}
.player-list{max-height:400px;overflow-y:auto;padding-right:6px}
.player-list::-webkit-scrollbar{width:6px}.player-list::-webkit-scrollbar-thumb{background:#2a3a5e;border-radius:3px}
.p-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card2);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s;border:1px solid transparent}
.p-row:hover{border-color:var(--blue);background:#22305a}.p-row.disabled{opacity:.3;cursor:not-allowed}
.p-row.disabled:hover{border-color:transparent;background:var(--card2)}
.p-pos{font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;background:#2a3a5e;color:var(--blue);min-width:40px;text-align:center}
.p-name{flex:1;font-weight:600;font-size:14px}
.p-rating{font-size:16px;font-weight:900;color:var(--gold);min-width:36px;text-align:right}
.stats{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat{flex:1;min-width:80px;background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-size:20px;font-weight:900;color:var(--blue)}.stat .l{font-size:10px;color:var(--muted);margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:var(--card);border:1px solid #2a3a5e;border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
.modal h3{color:var(--gold);margin-bottom:4px;font-size:18px}.modal .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.slot-pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:var(--card2);margin-bottom:6px;cursor:pointer;transition:.15s}
.slot-pick:hover{background:#22305a}.slot-pick .pos{font-weight:800;color:var(--blue);font-size:12px;min-width:50px}
.slot-pick .cur{color:var(--muted);font-size:12px;flex:1}.slot-pick .fit{font-weight:800;font-size:14px}
.fit-good{color:var(--green)}.fit-ok{color:var(--gold)}.fit-bad{color:var(--red)}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
.match-player{background:linear-gradient(180deg,#0a1228 0%,#060a14 100%);border:1px solid #22304f;border-radius:16px;padding:20px;margin-bottom:16px}
.mp-header{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:14px}
.mp-team{display:flex;flex-direction:column;align-items:center;gap:4px}
.mp-team .flag{font-size:30px}.mp-team .name{font-size:13px;font-weight:700;text-align:center;line-height:1.3}
.mp-score{font-size:40px;font-weight:900;letter-spacing:4px;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
.mp-clock{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.mp-clock .min{color:var(--blue);font-weight:900;font-size:16px}
.mp-progress{height:4px;background:#1b2440;border-radius:2px;overflow:hidden;margin-bottom:14px}
.mp-progress-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));width:0%;transition:width .15s linear}
.mp-controls{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.mp-btn{padding:8px 14px;border-radius:8px;border:1px solid #2a3a5e;background:var(--card2);color:var(--text);font-weight:700;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
.mp-btn:hover{border-color:var(--blue)}.mp-btn.active{background:var(--blue);color:#001428;border-color:var(--blue)}
.mp-events{background:rgba(0,0,0,.4);border-radius:10px;padding:12px;min-height:140px;max-height:220px;overflow-y:auto}
.mp-events::-webkit-scrollbar{width:6px}.mp-events::-webkit-scrollbar-thumb{background:#2a3a5e;border-radius:3px}
.ev{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:4px;font-size:13px;animation:evIn .25s ease-out}
@keyframes evIn{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
.ev-goal{background:rgba(34,214,122,.15);border-left:3px solid var(--green)}
.ev-yellow{background:rgba(255,217,61,.12);border-left:3px solid var(--yellow)}
.ev-red{background:rgba(255,77,109,.15);border-left:3px solid var(--red)}
.ev-penalty{background:rgba(0,212,255,.15);border-left:3px solid var(--blue)}
.ev-post{background:rgba(245,197,66,.15);border-left:3px solid var(--gold)}
.ev-save{background:rgba(123,136,168,.15);border-left:3px solid var(--muted)}
.ev-own{background:rgba(255,77,109,.2);border-left:3px solid var(--red)}
.ev-injury{background:rgba(255,180,180,.1);border-left:3px solid #ffb4b4}
.ev-minute{font-weight:900;color:var(--blue);font-size:12px;text-align:center}
.ev-text{font-weight:600;font-size:13px}.ev-text .side{font-size:10px;color:var(--muted);margin-left:6px}
.ev-score{font-weight:900;color:var(--gold);font-size:14px;letter-spacing:1px}
.mp-stage{text-align:center;font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:10px;font-weight:800}
.match-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px;font-size:13px}
.match-row.win{border-left:3px solid var(--green)}.match-row.draw{border-left:3px solid var(--gold)}.match-row.loss{border-left:3px solid var(--red)}
.match-stage{font-size:10px;color:var(--muted);min-width:70px}
.match-score{font-weight:800;font-size:15px}.match-opp{color:var(--muted);font-size:12px;margin-top:2px}
.result-hero{text-align:center;padding:24px}
.result-title{font-size:36px;font-weight:900;letter-spacing:3px}
.result-title.champion{background:linear-gradient(90deg,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-title.fail{color:var(--red);font-size:26px}.result-sub{color:var(--muted);margin-top:8px;font-size:14px}
.rank-table{width:100%;font-size:12px;border-collapse:collapse}
.rank-table th{text-align:left;padding:5px 6px;color:var(--muted);font-weight:600;border-bottom:1px solid #2a3a5e;font-size:10px}
.rank-table td{padding:5px 6px;border-bottom:1px solid #1b2440}
.rank-table tr.my-team{background:rgba(245,197,66,.12);font-weight:800}.rank-table tr.my-team td{color:var(--gold)}
.rank-table tr.qualify{border-left:3px solid var(--green)}
.rank-pos{width:22px;color:var(--muted);font-weight:700}
.rank-qual{color:var(--green);font-size:10px}.rank-play{color:var(--yellow);font-size:10px}.rank-out{color:var(--red);font-size:10px}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.scorers{grid-template-columns:1fr}}
.scorer-list{background:var(--card2);border-radius:10px;padding:12px}
.scorer-list h3{font-size:12px;color:var(--gold);margin-bottom:8px;letter-spacing:1px}
.scorer-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid #1b2440}
.scorer-row:last-child{border-bottom:none}.scorer-name{color:var(--text)}.scorer-val{color:var(--gold);font-weight:800}
.tab-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab-btn{padding:6px 12px;border-radius:8px;border:1px solid #2a3a5e;background:var(--card2);color:var(--text);font-weight:700;font-size:11px;cursor:pointer;font-family:inherit}
.tab-btn.active{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.award-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:600px){.award-row{grid-template-columns:1fr}}
.award-box{background:var(--card2);border-radius:10px;padding:12px;text-align:center}
.award-box .icon{font-size:24px}.award-box .label{font-size:10px;color:var(--muted);margin-top:4px}
.award-box .val{font-size:14px;font-weight:900;color:var(--gold);margin-top:4px;line-height:1.3}
.fixture-list{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:10px}
.fixture-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1b2440;font-size:13px}
.fixture-row:last-child{border-bottom:none}
.fixture-row .opp-name{font-weight:600}
.fixture-row .home-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(0,212,255,.15);color:var(--blue);margin-left:8px}
.fixture-row .away-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,77,109,.15);color:var(--red);margin-left:8px}
.legend{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.8}
.group-card{background:var(--card2);border:1px solid #2a3a5e;border-radius:10px;padding:10px;margin-bottom:10px}
.group-card h4{font-size:13px;color:var(--gold);margin-bottom:8px;letter-spacing:1px}
.group-card .rank-table{font-size:11px}
.group-card .rank-table th,.group-card .rank-table td{padding:4px 5px}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.8}

/* ============ 新增：阵容警示 / 替补席 / 点球 ============ */
.slot.warn{border-color:var(--red);box-shadow:0 0 14px rgba(255,77,109,.55)}
.slot.warn .num{color:var(--red)}
.lineup-bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0 2px;font-size:11px;color:var(--muted)}
.lineup-bar .tag{padding:3px 8px;border-radius:6px;background:rgba(0,212,255,.1);color:var(--blue);font-weight:700}
.lineup-bar .tag.red{background:rgba(255,77,109,.15);color:var(--red)}
.lineup-bar .tag.gold{background:rgba(245,197,66,.15);color:var(--gold)}
.bench-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:8px}
@media(min-width:1000px){.bench-grid{gap:4px;margin-top:5px}}
.bench-cell{background:var(--card2);border:1px dashed #2a3a5e;border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted);min-height:44px;display:flex;flex-direction:column;justify-content:center}
@media(min-width:1000px){.bench-cell{min-height:38px;padding:4px 3px}}
.bench-cell.filled{border:1px solid var(--blue);color:var(--text)}
.bench-cell .bn{font-weight:700;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench-cell .bp{font-size:9px;color:var(--blue)}
.str-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:900}
.pen-panel{text-align:center}
.pen-total{font-size:30px;font-weight:900;color:var(--gold);letter-spacing:3px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pen-rounds{display:flex;flex-direction:column;gap:3px;max-height:210px;overflow-y:auto}
.pen-round{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;padding:5px 10px;border-radius:8px;background:var(--card2);font-size:12px;animation:evIn .2s ease-out}
.pen-round.sudden{background:rgba(245,197,66,.15);border-left:3px solid var(--gold)}
.pr-no{color:var(--muted);font-weight:800;font-size:11px}
.pr-side.my{text-align:left;color:var(--blue);font-weight:700}
.pr-side.op{text-align:right;color:var(--red);font-weight:700}
.pen-result{margin-top:10px;font-size:14px;font-weight:800}
.mp-lineup{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:10px;color:var(--muted);margin:6px 0}
.mp-lineup .lk{padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.05)}
.mp-lineup .lk.low{background:rgba(255,77,109,.15);color:var(--red)}
.mp-lineup .lk.ban{background:rgba(255,77,109,.25);color:var(--red);font-weight:800}
.mini-btn{padding:6px 10px;border-radius:8px;border:1px solid #2a3a5e;background:var(--card2);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.mini-btn:hover{border-color:var(--blue)}

/* ============ PC 宽屏：双栏工作台 ============ */
.season-layout,.result-grid,.side-col{display:block}
/* 结果页列容器 */
.rg-col{display:flex;flex-direction:column;gap:12px;min-width:0}
/* 结果页内部滚动区（战绩 / 榜单不再无限拉长页面） */
.rs-box{max-height:300px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.rs-box::-webkit-scrollbar{width:6px}
.rs-box::-webkit-scrollbar-thumb{background:#3a4a6e;border-radius:3px}
.rs-box::-webkit-scrollbar-track{background:transparent}
.rs-bracket{max-height:420px}
@media(min-width:1280px){.rs-bracket{max-height:340px}}
.award-row-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:600px){.award-row-3{grid-template-columns:1fr}}
.result-hero{padding:24px}
@media(min-width:1000px){.result-hero{padding:14px}}
@media(min-width:1000px){
  #app{max-width:1360px}
  /* PC 下限制球场高度：aspect-ratio 3/4 在宽屏会撑到 960px+，整页被迫滚动 */
  .pitch{aspect-ratio:auto;height:min(44vh,460px)}
  .bench-cell{min-height:36px;padding:4px 3px}
  .bench-grid{gap:4px;margin-top:5px}
  .game-layout{grid-template-columns:1.1fr 1fr;gap:20px}
  .season-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
  .match-player{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
  .mp-events{max-height:320px}
  /* 结果页：1000px 起双栏 */
  .result-grid{display:grid!important;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .rs-box{max-height:280px}
  /* 布阵页：首发列表内部滚动，压到单屏 */
  .lu-list{max-height:318px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
}
/* 结果页：1280px 起三栏驾驶舱，压到单屏 */
@media(min-width:1280px){
  .result-grid{display:grid!important;grid-template-columns:0.92fr 1.05fr 1fr;gap:14px;align-items:start}
  .header{padding:10px 14px}
  .header h1{font-size:19px}
  .header p{font-size:11px;margin-top:3px}
  .panel{padding:11px 13px}
  .panel h2{font-size:14px;margin-bottom:8px}
  /* 布阵页：战术板与首发列同步压缩，整页压进单屏 */
  .tactic-pitch{max-height:min(30vh,260px);height:min(30vh,260px)}
  .tactic-bench{gap:3px;margin-top:5px}
  .lu-card{padding:5px 8px;gap:6px}
  /* 首发 11 人列表：超高则内部滚动，不撑破单屏 */
  .lu-list{max-height:min(38vh,420px);overflow-y:auto;overscroll-behavior:contain}
  .lu-list::-webkit-scrollbar{width:6px}
  .lu-list::-webkit-scrollbar-thumb{background:#3a4a6e;border-radius:3px}
  .rs-box{max-height:268px}
  .award-row{grid-template-columns:1fr 1fr;gap:8px}
  .scorers{grid-template-columns:1fr;gap:10px}
}
@media(min-width:1500px){
  #app{max-width:1560px}
  .pitch{height:min(48vh,520px)}

/* ============ 战术板（可视化球场） ============ */
.tactic-wrap{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:12px;align-items:start}
@media(max-width:900px){.tactic-wrap{grid-template-columns:1fr}}
@media(max-width:600px){
  .rs-box{max-height:240px}
  .rs-bracket{max-height:260px}
  .tactic-pitch{max-height:52vh;aspect-ratio:auto;height:52vh}
  .tp-player{width:52px}
  .tp-dot{width:32px;height:32px}
  .tactic-bench{grid-template-columns:repeat(3,1fr)}
}
.tactic-pitch{
  position:relative;width:100%;aspect-ratio:3/4;max-height:300px;margin:0 auto;
  background:repeating-linear-gradient(0deg,#0e3d24 0 12.5%,#134a2c 12.5% 25%);
  border:2px solid #3a7d52;border-radius:10px;overflow:hidden;
}
.tactic-pitch::before{ /* 中线 + 中圈 */
  content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.22);
}
.tactic-pitch::after{
  content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.22);border-radius:50%;
}
.tp-box{position:absolute;left:8%;right:8%;height:16%;border:2px solid rgba(255,255,255,.2);border-radius:4px}
.tp-box.top{top:0;border-top:none}
.tp-box.bot{bottom:0;border-bottom:none}
.tp-player{
  position:absolute;transform:translate(-50%,-50%);width:60px;text-align:center;
  cursor:pointer;transition:transform .12s;z-index:2;
}
.tp-player:hover{transform:translate(-50%,-50%) scale(1.08)}
.tp-dot{
  width:36px;height:36px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#04140a;border:2px solid rgba(0,0,0,.35);
  box-shadow:0 2px 6px rgba(0,0,0,.45);position:relative;
}
.tp-dot.fit-good{background:linear-gradient(145deg,#4ade80,#16a34a)}
.tp-dot.fit-ok{background:linear-gradient(145deg,#fcd34d,#f59e0b)}
.tp-dot.fit-bad{background:linear-gradient(145deg,#fb7185,#e11d48)}
.tp-dot.sel{outline:3px solid var(--gold);outline-offset:2px;transform:scale(1.15)}
.tp-dot.low{border-color:var(--red);border-width:3px}
.tp-dot.banned{opacity:.55;filter:grayscale(.6)}
.tp-name{
  font-size:9px;color:#eaf6ee;margin-top:2px;line-height:1.15;
  text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tp-stam{height:3px;background:rgba(0,0,0,.5);border-radius:2px;margin:2px auto 0;width:44px;overflow:hidden}
.tp-stam i{display:block;height:100%}
.tp-pos-tag{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  font-size:8px;font-weight:900;background:#0b1a2e;color:var(--gold);
  padding:0 4px;border-radius:4px;border:1px solid rgba(245,197,66,.4);z-index:3;
}
.tactic-bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:4px;margin-top:8px}
@media(max-width:600px){.tactic-bench{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}}
.tb-cell{
  background:var(--card2);border:1.5px dashed #3a4a6e;border-radius:8px;padding:6px 4px;text-align:center;
  cursor:pointer;height:44px;min-height:44px;max-height:44px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
}
.tb-cell.filled{border-style:solid;border-color:var(--blue)}
.tb-cell.sel{border-color:var(--gold);background:rgba(245,197,66,.12)}
.tb-cell .n{font-size:9px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-cell .p{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden}
.tb-cell .s{font-size:8px;font-weight:900;margin-top:1px}
.tactic-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:9px;color:var(--muted);margin-top:6px;justify-content:center}

  // 俱乐部徽章：纯 CSS 渲染（无外部图片依赖），主色渐变底 + 队名缩写
  function clubBadge(name,size){
    const s=size||20,m=CLUB_META[name];
    if(!m){
      const t=String(name||"?").replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"").slice(0,2)||"?";
      return `<span class="cbadge" style="width:${s}px;height:${s}px;font-size:${Math.round(s*(t.length>2?0.26:0.34))}px;background:linear-gradient(135deg,#2b3654,#1a2238);color:#aab6d0">${t}</span>`;
    }
    return `<span class="cbadge" style="width:${s}px;height:${s}px;font-size:${Math.round(s*m.fs)}px;background:linear-gradient(135deg,${m.c1},${m.c2});color:${m.tc}">${m.t}</span>`;
  }

  // 纯函数：给定 slots 数组算阵容评分（口径与 calculateTeamStrength 完全一致）
  function teamStrengthOf(slots,useStam){
    const f=FORMATIONS[state.formation];

    f.slots.forEach((slot,i)=>{
      const p=slots[i];if(!p)return;
      const fit=fitOf(p,slot.p);
      const st=useStam?Math.max(30,state.stamina[p.n]==null?100:state.stamina[p.n]):100;
      const bb=p.fromBench?(1+coachBenchBonus()):1;
      total+=p.r*fit*(0.84+0.16*(st/100))*bb;
      tc[p.teamId]=(tc[p.teamId]||0)+1;
    });
    let base=total/f.slots.length;
    let chem=0;Object.values(tc).forEach(c=>{if(c>=2)chem+=(c-1)*0.02});

  function bestElevenFromPool(useStam){

          const st=useStam?Math.max(30,state.stamina[p.n]==null?100:state.stamina[p.n]):100;

  function staminaWearMul(p){

  const SCORE_R_BASE=82, SCORE_R_EXP=4.0, CORE_MUL=1.5;

    const ga=poiRand(aL),gb=poiRand(bL);
    // 淘汰赛进球也计入战绩表 gf/ga，否则淘汰赛后积分榜数据不完整
    if(tally){a.gf+=ga;a.ga+=gb;b.gf+=gb;b.ga+=ga}
    for(let i=0;i<ga;i++){
      const sc=pickScorer(aSq,aCore);updateScorer(sc.n,a.club,1);
      if(Math.random()<0.7){const ap=aSq.filter(p=>p.n!==sc.n);if(ap.length){const as=pickAssister(ap,aCore,sc.n);if(as){updateAssister(as.n,a.club,1);recordLinkup(as.n,sc.n)}}}
    }
    for(let i=0;i<gb;i++){
      const sc=pickScorer(bSq,bCore);updateScorer(sc.n,b.club,1);
      if(Math.random()<0.7){const ap=bSq.filter(p=>p.n!==sc.n);if(ap.length){const as=pickAssister(ap,bCore,sc.n);if(as){updateAssister(as.n,b.club,1);recordLinkup(as.n,sc.n)}}}
    }
    return [ga,gb];
  }
  // AI 点球大战
  function aiShootout(a,b){
    const pa=Math.min(0.88,Math.max(0.5,a.str/(a.str+b.str)+0.08));
    let x=0,y=0;
    for(let i=0;i<5;i++){
      if(Math.random()<pa)x++;
      if(Math.random()<1-pa)y++;
    }
    let guard=0;
    while(x===y&&guard<30){guard++;if(Math.random()<pa)x++;if(Math.random()<1-pa)y++}
    return [x,y];
  }
  // AI 淘汰赛：16强/8强/半决赛 两回合，决赛单场；平局加时→点球（与玩家赛制完全一致）
  // 记录单场比赛的胜负平（与 updateStandings 同口径，但不重复累加 matches/gf/ga）
  function recordLegResult(home,away,gh,ga){
    if(!home||!away)return;
    if(gh>ga){home.wins=(home.wins||0)+1;away.losses=(away.losses||0)+1}
    else if(gh<ga){away.wins=(away.wins||0)+1;home.losses=(home.losses||0)+1}
    else{home.draws=(home.draws||0)+1;away.draws=(away.draws||0)+1}
  }
  function simOtherKnockoutMatch(teamA,teamB,isFinal){
    const aCore=teamA.core||coreScorers(teamA.squad), bCore=teamB.core||coreScorers(teamB.squad);
    const dm=DIFF_MUL[state.difficulty]||1;
    if(isFinal){
      teamA.matches=(teamA.matches||0)+1;teamB.matches=(teamB.matches||0)+1;
      let [ga,gb]=aiLeg(teamA,teamB,dm,true,aCore,bCore,1);
      let penalty=null;
      if(ga===gb){
        const [ex,ey]=aiLeg(teamA,teamB,dm,true,aCore,bCore,1);
        ga+=Math.round(ex*0.78);gb+=Math.round(ey*0.78);
        if(ga===gb){
          penalty=aiShootout(teamA,teamB);
          const w=penalty[0]>penalty[1]?teamA:teamB, l=w===teamA?teamB:teamA;
          // 点球决出：按点球胜者记胜（保证 场次=胜+平+负 成立）
          w.wins=(w.wins||0)+1;l.losses=(l.losses||0)+1;
          return {ga,gb,winner:w,penalty,legs:[[ga,gb]]};
        }
      }
      recordLegResult(teamA,teamB,ga,gb);
      return {ga,gb,winner:ga>gb?teamA:teamB,penalty,legs:[[ga,gb]]};
    }
    // 两回合：A 先主场，B 再主场
    teamA.matches=(teamA.matches||0)+2;teamB.matches=(teamB.matches||0)+2;
    const l1=aiLeg(teamA,teamB,dm,true,aCore,bCore,1);   // A 主场 → [A进, B进]
    const l2=aiLeg(teamB,teamA,dm,true,bCore,aCore,1);   // B 主场 → [B进, A进]
    let ga=l1[0]+l2[1], gb=l1[1]+l2[0];
    const legs=[[l1[0],l1[1]],[l2[1],l2[0]]];
    // 两个回合各按当回合比分独立记胜负平（与 matches+2 对齐）
    recordLegResult(teamA,teamB,l1[0],l1[1]);
    recordLegResult(teamB,teamA,l2[0],l2[1]);
    if(ga===gb){
      // 加时（按第二回合场地，进球率 ×0.78）
      const [ex,ey]=aiLeg(teamB,teamA,dm,true,bCore,aCore,1);
      ga+=Math.round(ey*0.78);gb+=Math.round(ex*0.78);
      if(ga===gb){
        const penalty=aiShootout(teamA,teamB);
        return {ga,gb,winner:penalty[0]>penalty[1]?teamA:teamB,penalty,legs};
      }
    }
    return {ga,gb,winner:ga>gb?teamA:teamB,penalty:null,legs};
  }
  function buildKnockoutBracket(){
    const g1={},g2={};
    state.groups.forEach((g,i)=>{
      const sorted=sortGroupTable(g.teams);
      const letter=String.fromCharCode(65+i);
      g1[letter]=sorted[0];
      g2[letter]=sorted[1];
    });
    const r16Pairs=[
      [g1.A,g2.B],[g1.C,g2.D],[g1.E,g2.F],[g1.G,g2.H],
      [g1.B,g2.A],[g1.D,g2.C],[g1.F,g2.E],[g1.H,g2.G],
    ].filter(p=>p[0]&&p[1]);
    state.knockoutBracket={
      r16:r16Pairs.map(p=>({a:p[0],b:p[1],winner:null,score:null,isMy:p[0].isMine||p[1].isMine})),
      qf:[],sf:[],final:null,champion:null,
    };
  }
  function ensureBracketAdvanced(){
    const br=state.knockoutBracket;
    if(!br)return;
    if(br.r16.every(p=>p.winner)&&br.qf.length===0){
      for(let i=0;i<br.r16.length;i+=2){
        if(!br.r16[i+1])break;
        br.qf.push({a:br.r16[i].winner,b:br.r16[i+1].winner,winner:null,score:null,isMy:br.r16[i].winner.isMine||br.r16[i+1].winner.isMine});
      }
    }
    if(br.qf.length&&br.qf.every(p=>p.winner)&&br.sf.length===0){
      for(let i=0;i<br.qf.length;i+=2){
        if(!br.qf[i+1])break;
        br.sf.push({a:br.qf[i].winner,b:br.qf[i+1].winner,winner:null,score:null,isMy:br.qf[i].winner.isMine||br.qf[i+1].winner.isMine});
      }
    }
    if(br.sf.length>=2&&br.sf.every(p=>p.winner)&&!br.final){
      br.final={a:br.sf[0].winner,b:br.sf[1].winner,winner:null,score:null,isMy:br.sf[0].winner.isMine||br.sf[1].winner.isMine};
    }
  }
  function myPairAtStage(stage){
    const br=state.knockoutBracket;
    if(!br)return null;
    if(stage==="16强") return br.r16.find(p=>p.isMy);
    if(stage==="8强") return br.qf.find(p=>p.isMy);
    if(stage==="半决赛") return br.sf.find(p=>p.isMy);
    if(stage==="决赛") return br.final;
    return null;
  }
  function resolveMyPair(stage,myScore,oppScore,won){
    const myPair=myPairAtStage(stage);
    if(!myPair) return;
    const isA=myPair.a.isMine;
    myPair.a.matches=(myPair.a.matches||0)+1;myPair.b.matches=(myPair.b.matches||0)+1;
    if(!myPair.legs)myPair.legs=[];
    myPair.legs.push(isA?[myScore,oppScore]:[oppScore,myScore]);
    // score 存总比分：两回合时 legs 已含两场，累加即为总比分
    if(myPair.legs.length>=2){
      myPair.score=[myPair.legs[0][0]+myPair.legs[1][0],myPair.legs[0][1]+myPair.legs[1][1]];
    }else{
      myPair.score=isA?[myScore,oppScore]:[oppScore,myScore];
    }
    myPair.winner=won?(isA?myPair.a:myPair.b):(isA?myPair.b:myPair.a);
  }
  function simulateRestOfTournament(){
    const br=state.knockoutBracket;
    if(!br)return;
    br.r16.forEach(p=>{
      if(p.winner)return;
      if(p.isMy){forfeitMyPair(p);return}
      const r=simOtherKnockoutMatch(p.a,p.b,false);
      p.score=[r.ga,r.gb];p.winner=r.winner;p.legs=r.legs;if(r.penalty)p.penalty=r.penalty;
    });
    ensureBracketAdvanced();
    br.qf.forEach(p=>{
      if(p.winner)return;
      if(p.isMy){forfeitMyPair(p);return}
      const r=simOtherKnockoutMatch(p.a,p.b,false);
      p.score=[r.ga,r.gb];p.winner=r.winner;p.legs=r.legs;if(r.penalty)p.penalty=r.penalty;
    });
    ensureBracketAdvanced();
    br.sf.forEach(p=>{
      if(p.winner)return;
      if(p.isMy){forfeitMyPair(p);return}
      const r=simOtherKnockoutMatch(p.a,p.b,false);
      p.score=[r.ga,r.gb];p.winner=r.winner;p.legs=r.legs;if(r.penalty)p.penalty=r.penalty;
    });
    ensureBracketAdvanced();
    if(br.final&&!br.final.winner){
      const r=simOtherKnockoutMatch(br.final.a,br.final.b,true);
      br.final.score=[r.ga,r.gb];br.final.winner=r.winner;br.final.legs=r.legs;if(r.penalty)br.final.penalty=r.penalty;
    }
    br.champion=br.final?br.final.winner:null;
  }
  function computeTournamentMVP(){
    const c={};
    state.allScorers.forEach(s=>{if(!c[s.name])c[s.name]={name:s.name,goals:0,assists:0,team:s.team};c[s.name].goals=s.goals});
    state.allAssisters.forEach(a=>{if(!c[a.name])c[a.name]={name:a.name,goals:0,assists:0,team:a.team};c[a.name].assists=a.assists});
    let best=null,bs=-1;
    Object.values(c).forEach(x=>{const s=x.goals*3+x.assists*2;if(s>bs){bs=s;best=x}});
    state.tournamentMVP=best;
  }
  function renderBracket(){
    const br=state.knockoutBracket;
    if(!br)return '';
    function renderPairs(pairs){
      if(!pairs||!pairs.length)return '<div style="color:#7b88a8;font-size:11px;padding:8px">未生成</div>';

    }
    return `<div class="panel"><h2>🏆 淘汰赛对阵</h2>

      <div style="margin-bottom:10px"><h3 style="font-size:12px;color:var(--gold);margin-bottom:5px">8强</h3>${renderPairs(br.qf)}</div>
      <div style="margin-bottom:10px"><h3 style="font-size:12px;color:var(--gold);margin-bottom:5px">半决赛</h3>${renderPairs(br.sf)}</div>
      <div><h3 style="font-size:12px;color:var(--gold);margin-bottom:5px">决赛</h3>${br.final?renderPairs([br.final]):'<div style="color:#7b88a8;font-size:11px;padding:8px">未生成</div>'}</div>
      </div>
      ${br.champion?`<div style="text-align:center;margin-top:10px;font-size:16px;color:var(--gold);font-weight:900">🏆 ${clubBadge(br.champion.club,22)} ${br.champion.club}</div>`:''}
    </div>`;
  }
  function generateRandomEvent(min,myPlayers,oppPlayers,side,mg,og,myCore,oppCore){
    const r=Math.random();
    if(r<0.12){
      const isMy=side==="my";
      const players=isMy?myPlayers:oppPlayers;
      const taker=pickScorer(players,side==="my"?myCore:oppCore);
      if(Math.random()<0.75){
        const newMg=isMy?mg+1:mg;const newOg=isMy?og:og+1;
        return {min,type:"penalty",team:isMy?"my":"opp",player:taker.n,scored:true,score:[newMg,newOg]};
      }else{return {min,type:"penalty",team:isMy?"my":"opp",player:taker.n,scored:false}}
    }
    if(r<0.37){const isMy=side==="my";const players=isMy?myPlayers:oppPlayers;const shooter=pickScorer(players,isMy?myCore:oppCore);return {min,type:"post",team:isMy?"my":"opp",player:shooter.n}}
    if(r<0.67){const isMy=side==="my";const players=isMy?myPlayers:oppPlayers;const shooter=pickScorer(players,isMy?myCore:oppCore);return {min,type:"save",team:isMy?"my":"opp",player:shooter.n}}
    if(r<0.75){
      const isMy=side==="my";
      const players=isMy?oppPlayers:myPlayers;
      const p=pickCard(players);
      const newMg=isMy?mg+1:mg;const newOg=isMy?og:og+1;
      return {min,type:"own",team:isMy?"my":"opp",player:p.n,score:[newMg,newOg]};
    }
    const isMy=side==="my";const players=isMy?myPlayers:oppPlayers;const p=pickCard(players);
    return {min,type:"injury",team:isMy?"my":"opp",player:p.n};
  }
  // -------- 点球大战 --------
  function shootout(myPlayers,oppPlayers){
    const rank=a=>[...a].sort((x,y)=>y.r-x.r);
    const myT=rank(myPlayers.filter(p=>p.p!=="GK")), opT=rank(oppPlayers.filter(p=>p.p!=="GK"));
    const myGk=myPlayers.find(p=>p.p==="GK")||{r:72}, opGk=oppPlayers.find(p=>p.p==="GK")||{r:72};
    const pb=coachPenBonus();
    const pIn=(t,gk,bonus)=>Math.max(0.45,Math.min(0.94,0.74+(t.r-gk.r)/380+(bonus||0)));
    const detail=[];let my=0,opp=0;let r=0;
    while(true){
      const a=myT[r%myT.length],b=opT[r%opT.length];
      const sa=Math.random()<pIn(a,opGk,pb), sb=Math.random()<pIn(b,myGk,0);
      if(sa)my++;if(sb)opp++;
      detail.push({round:r+1,a:a.n,aScored:sa,b:b.n,bScored:sb,sudden:r>=5});
      r++;
      if(r>=5&&my!==opp)break;
      if(r>14)break;
    }
    return {my,opp,detail};
  }
  function simulateDetailed(myStr,oppStr,isHome,myPlayers,oppTeam,opts){
    opts=opts||{};
    const myCore=coreScorers(myPlayers), oppCore=coreScorers(oppTeam.squad);
    const ha=isHome?1.15:0.92;
    const cm=coachAttackMul(), cd=coachDefenseMul();
    const myL=Math.min(4.2,Math.max(0.35,GOAL_BASE*Math.pow((myStr*MY_BOOST)/oppStr,MY_EXP)*ha*cm));
    const oppL=Math.min(4.2,Math.max(0.15,GOAL_BASE*Math.pow(oppStr/(myStr*MY_BOOST),MY_EXP)/ha*cd));
    const oppPlayers=oppTeam.squad;
    const events=[];let mg=0,og=0;const myY={},oppY={};const reds=[];
    function runPeriod(from,to,factor){
      for(let min=from;min<=to;min++){
        // 逆风加成：落后方更拼命，让比分咬得更紧（绝杀率翻倍的关键）
        let mFac=factor, oFac=factor;
        const gap=og-mg;   // >0 表示我方落后
        if(gap>=2){mFac*= (1+COMEBACK_K2);}
        else if(gap===1){mFac*= (1+COMEBACK_K);}
        else if(gap<=-2){oFac*= (1+COMEBACK_K2);}
        else if(gap===-1){oFac*= (1+COMEBACK_K);}
        if(Math.random()<myL*mFac/90){
          const sc=pickScorer(myPlayers,myCore);
          const ap=myPlayers.filter(p=>p.n!==sc.n);
          const as=ap.length?pickAssister(ap,myCore,sc.n):null;
          if(as)recordLinkup(as.n,sc.n);   // 连线记忆
          mg++;
          events.push({min,type:"goal",team:"my",player:sc.n,assist:as?as.n:null,score:[mg,og],et:from>90});
        }
        if(Math.random()<oppL*oFac/90){const sc=pickScorer(oppPlayers,oppCore);og++;events.push({min,type:"goal",team:"opp",player:sc.n,assist:null,score:[mg,og],et:from>90})}
        if(Math.random()<0.018){
          const side=Math.random()<0.5?"my":"opp";
          const ps=side==="my"?myPlayers:oppPlayers;
          const pl=pickCard(ps);
          const ym=side==="my"?myY:oppY;
          ym[pl.n]=(ym[pl.n]||0)+1;
          events.push({min,type:"yellow",team:side,player:pl.n});
          if(ym[pl.n]===2){events.push({min,type:"red",team:side,player:pl.n,reason:"两黄变一红",et:from>90});if(side==="my")reds.push(pl.n)}
        }
        if(Math.random()<0.001){
          const side=Math.random()<0.5?"my":"opp";
          const ps=side==="my"?myPlayers:oppPlayers;
          const pl=pickCard(ps);
          events.push({min,type:"red",team:side,player:pl.n,reason:"直接红牌",et:from>90});
          if(side==="my")reds.push(pl.n);
        }
        if(Math.random()<0.02){
          const side=Math.random()<0.5?"my":"opp";
          const ev=generateRandomEvent(min,myPlayers,oppPlayers,side,mg,og,myCore,oppCore);
          events.push(ev);
          if((ev.type==="penalty"&&ev.scored)||ev.type==="own"){mg=ev.score[0];og=ev.score[1]}
        }
      }
    }
    runPeriod(1,90,1);
    let hasET=false,pens=null;
    if(opts.allowET){
      const aggMy=mg+(opts.firstLeg?opts.firstLeg.myGoals:0);
      const aggOpp=og+(opts.firstLeg?opts.firstLeg.oppGoals:0);
      if(aggMy===aggOpp){
        hasET=true;
        events.push({min:90,type:"whistle",text:"⏱ 90分钟战平，进入加时赛"});
        runPeriod(91,120,0.78*coachETMul());
        const etMy=mg+(opts.firstLeg?opts.firstLeg.myGoals:0);
        const etOpp=og+(opts.firstLeg?opts.firstLeg.oppGoals:0);
        if(etMy===etOpp){
          events.push({min:120,type:"whistle",text:"⏱ 加时赛仍未分胜负，进入点球大战"});
          pens=shootout(myPlayers,oppPlayers);
          events.push({min:120,type:"penShootout",my:pens.my,opp:pens.opp,text:`🥅 点球大战 ${pens.my}-${pens.opp}`});
        }
      }
    }
    const aggMy=mg+(opts.firstLeg?opts.firstLeg.myGoals:0);
    const aggOpp=og+(opts.firstLeg?opts.firstLeg.oppGoals:0);
    return{events,myGoals:mg,oppGoals:og,oppTeam,isHome,myStr,oppStr,hasET,pens,aggMy,aggOpp,reds,totalMin:hasET?120:90};
  }
  function updateStandings(a,b,ga,gb){
    a.played++;b.played++;a.matches=(a.matches||0)+1;b.matches=(b.matches||0)+1;a.gf+=ga;a.ga+=gb;b.gf+=gb;b.ga+=ga;
    if(ga>gb){a.wins++;a.pts+=3;b.losses++}
    else if(ga<gb){b.wins++;b.pts+=3;a.losses++}
    else{a.draws++;a.pts+=1;b.draws++;b.pts+=1}
  }
  function getGroupRoundPairs(round){
    const pairs=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]],[[1,0],[3,2]],[[2,0],[3,1]],[[3,0],[2,1]]];
    return pairs[round]||[];
  }

  // -------- 修复：buildGroups 过滤 B 队 + 保证 32 队 --------
  function buildGroups(){
    const yearTeams=getTeamsByYear(state.year);
    const usedClubNames=new Set();
    const picked=[];
    // 1. 同年优先进池（B 队已在 getTeamsByYear 被过滤）
    [...yearTeams].sort(()=>Math.random()-0.5).forEach(t=>{
      if(usedClubNames.has(t.club))return;
      usedClubNames.add(t.club);
      picked.push(t);
    });
    // 2. 相邻年份补足
    const offsets=[1,-1,2,-2,3,-3];
    for(const off of offsets){
      if(picked.length>=32)break;
      const y=state.year+off;
      const teams=getTeamsByYear(y).sort(()=>Math.random()-0.5);
      for(const t of teams){
        if(picked.length>=32)break;
        if(usedClubNames.has(t.club))continue;
        usedClubNames.add(t.club);
        picked.push(t);
      }
    }
    // 3. 全历史补足
    if(picked.length<32){
      const all=getAllTeams().filter(t=>!usedClubNames.has(t.club)).sort(()=>Math.random()-0.5);
      for(const t of all){
        if(picked.length>=32)break;
        usedClubNames.add(t.club);
        picked.push(t);
      }
    }
    const allTeamsForGroups=picked.slice(0,32).map(t=>{
      const st=pickStarters(t.squad);
      return {
        club:t.club,flag:t.flag,season:t.season,str:calcTeamStrength(t),squad:t.squad,id:t.id,
        starters:st, core:coreScorers(st.length>=11?st:t.squad),matches:0,
        pts:0,gf:0,ga:0,wins:0,draws:0,losses:0,played:0,isMine:false
      };
    });
    // 4. 用户顶替最弱队
    const sortedByStr=[...allTeamsForGroups].sort((a,b)=>a.str-b.str);
    const candidatePool=sortedByStr.slice(8,22);
    const candidate=candidatePool[Math.floor(Math.random()*candidatePool.length)];
    const ci=allTeamsForGroups.findIndex(t=>t.id===candidate.id);
    const myStr=calculateTeamStrength();
    const myLabel=state.mode==="legacy"&&state.legacyClub?state.legacyClub:"我的阵容";
    allTeamsForGroups[ci]={club:myLabel,flag:state.mode==="legacy"&&state.legacyClub?"🏛":"⭐",str:myStr,squad:getAllSquadPlayers(),id:"my",season:state.year,isMine:true,core:coreScorers(getAllSquadPlayers()),matches:0,pts:0,gf:0,ga:0,wins:0,draws:0,losses:0,played:0};
    // 5. 8 组（玩家同组对手从实力上游池抽取，保证小组赛有挑战）
    const myTeam=allTeamsForGroups.find(t=>t.isMine)||allTeamsForGroups[0];
    const others=[...allTeamsForGroups].filter(t=>t!==myTeam);
    const byStr=[...others].sort((a,b)=>b.str-a.str);
    const n=byStr.length;
    const mix=GROUP_MIX[state.difficulty]||GROUP_MIX.classic;
    const sTop=Math.max(mix.strong,Math.round(n*mix.sBand));
    const mLo=Math.floor(n*mix.mLo),mHi=Math.max(mLo+1,Math.floor(n*mix.mHi));
    let strongPool=byStr.slice(0,sTop);
    let midPool=byStr.slice(mLo,mHi).filter(t=>!strongPool.includes(t));
    const myOpps=[];
    for(let i=0;i<mix.strong;i++){
      if(!strongPool.length)break;
      myOpps.push(strongPool.splice(Math.floor(Math.random()*strongPool.length),1)[0]);
    }
    for(let i=0;i<mix.mid;i++){
      if(!midPool.length){midPool=strongPool.length?strongPool:byStr.filter(t=>!myOpps.includes(t))}
      if(!midPool.length)break;
      myOpps.push(midPool.splice(Math.floor(Math.random()*midPool.length),1)[0]);
    }
    // 兜底：不足 3 个就从剩余里补
    if(myOpps.length<3){
      const rest=byStr.filter(t=>!myOpps.includes(t));
      while(myOpps.length<3&&rest.length)myOpps.push(rest.shift());
    }
    const restPool=[...others].filter(t=>!myOpps.includes(t)).sort(()=>Math.random()-0.5);
    const rawGroups=[{teams:[myTeam,...myOpps]}];
    for(let i=0;i<7;i++){
      rawGroups.push({teams:restPool.slice(i*4,(i+1)*4)});
    }
    const groups=rawGroups.sort(()=>Math.random()-0.5);
    groups.forEach((g,i)=>{g.name=String.fromCharCode(65+i)+"组"});
    state.groups=groups;
    state.myGroupIdx=groups.findIndex(g=>g.teams.some(t=>t.isMine));
    if(state.myGroupIdx<0)state.myGroupIdx=0;
    const myGroup=groups[state.myGroupIdx];
    const opps=myGroup.teams.filter(t=>!t.isMine);
    state.myFixtures=[
      {round:1,opp:opps[0],isHome:true},
      {round:2,opp:opps[1],isHome:false},
      {round:3,opp:opps[2],isHome:true},
      {round:4,opp:opps[0],isHome:false},
      {round:5,opp:opps[1],isHome:true},
      {round:6,opp:opps[2],isHome:false},
    ];
    state.currentMatchIdx=0;
    state.leagueStageResults=[];
    state.otherRoundResults=[];
  }
  function simulateRoundOthers(round){
    const dm=DIFF_MUL[state.difficulty]||1;
    const pairs=getGroupRoundPairs(round-1);
    state.groups.forEach((g,gIdx)=>{
      pairs.forEach(([i1,i2])=>{
        const a=g.teams[i1],b=g.teams[i2];
        if(!a||!b)return;
        if(a.isMine||b.isMine)return;
        const [ga,gb]=quickSim(a,b,dm);
        updateStandings(a,b,ga,gb);
        state.otherRoundResults.push({round,gIdx,home:a.club,homeFlag:a.flag,away:b.club,awayFlag:b.flag,ga,gb});
      });
    });
  }

          if(ev.team==="my")sp.myScore++;else sp.oppScore++;

        const box=document.getElementById("mpEvents");
        if(box){const d=document.createElement("div");d.innerHTML=renderEvent(ev);if(d.firstElementChild)box.appendChild(d.firstElementChild);box.scrollTop=box.scrollHeight}
        sp.shownCount++;
      }
      const ck=document.getElementById("clockMin");if(ck)ck.textContent=sp.minute+"'";
      const sc=document.getElementById("scoreDisplay");if(sc)sc.textContent=sp.myScore+" - "+sp.oppScore;
      const TMy=sp.matchData?(sp.matchData.totalMin||90):90;
      const bar=document.getElementById("progBar");if(bar)bar.style.width=(sp.minute/TMy*100)+"%";
      const TM=sp.matchData?(sp.matchData.totalMin||90):90;
      if(sp.minute>=TM){sp.minute=TM;sp.playing=false;sp.finished=true;finishMatch();return}
      sp.timer=setTimeout(step,Math.max(15,120/sp.speed));
    }
    sp.timer=setTimeout(step,150);
  }
  function togglePlayback(){
    const sp=state.player;
    if(sp.finished){proceedAfterMatch();return}
    if(sp.playing){sp.playing=false;if(sp.timer){clearTimeout(sp.timer);sp.timer=null}}
    else{sp.playing=true;startPlayback()}

  function skipToEnd(){
    const sp=state.player;
    if(sp.finished&&sp.recorded)return;
    if(sp.timer){clearTimeout(sp.timer);sp.timer=null}
    const TM=sp.matchData?(sp.matchData.totalMin||90):90;
    sp.playing=false;sp.minute=TM;sp.finished=true;
    while(sp.shownCount<sp.allEvents.length){
      const ev=sp.allEvents[sp.shownCount];
      if(ev.type==="goal"){
        if(ev.team==="my")sp.myScore++;else sp.oppScore++;
        const tl=ev.team==="my"?"my":currentOppClub();
        updateScorer(ev.player,tl,1);
        if(ev.assist)updateAssister(ev.assist,tl,1);
      } else if(ev.type==="penalty"&&ev.scored){
        if(ev.team==="my")sp.myScore++;else sp.oppScore++;
        updateScorer(ev.player,ev.team==="my"?"my":currentOppClub(),1);
      } else if(ev.type==="own"){
        if(ev.team==="my")sp.myScore++;else sp.oppScore++;
      }
      sp.shownCount++;
    }
    if(sp.matchData){
      sp.myScore=sp.matchData.myGoals;
      sp.oppScore=sp.matchData.oppGoals;
    }
    const box=document.getElementById("mpEvents");if(box){box.innerHTML=sp.allEvents.map(ev=>renderEvent(ev)).join("");box.scrollTop=box.scrollHeight}
    const ck=document.getElementById("clockMin");if(ck)ck.textContent=TM+"'";
    const sc=document.getElementById("scoreDisplay");if(sc)sc.textContent=sp.myScore+" - "+sp.oppScore;
    const bar=document.getElementById("progBar");if(bar)bar.style.width="100%";

  function finishMatch(){
    const sp=state.player;

    showPenalties(sp.matchData);

    tickSuspension(sp.matchData?(sp.matchData.reds||[]):[]);
    if(state.phase==="knockout"){
      const stage=state.knockoutCurrentStage;
      const opp=state.knockoutCurrentOpp;
      const isFirst=state.knockoutIsFirstLeg;
      const md0=sp.matchData||{};
      state.matchResults.push({stage:stage+(state.knockoutIsFinal?'':' 第'+(isFirst?1:2)+'回合'),opp,myGoals:sp.myScore,oppGoals:sp.oppScore,isHome:isFirst,pen:md0.pens?[md0.pens.my,md0.pens.opp]:null,et:md0.hasET||false});

      if(opp&&typeof opp==="object"){
        const oppT=state.groups.flatMap(g=>g.teams).find(t=>t.id===opp.id)||opp;
        const myT=state.groups.flatMap(g=>g.teams).find(t=>t.isMine);
        if(myT){
          if(isFirst)updateStandings(myT,oppT,sp.myScore,sp.oppScore);
          else updateStandings(oppT,myT,sp.oppScore,sp.myScore);
        }else{
          oppT.played++;oppT.matches=(oppT.matches||0)+1;
          oppT.gf+=sp.oppScore;oppT.ga+=sp.myScore;
        }
      }
      return;
    }
    const cur=state.myFixtures[state.currentMatchIdx];
    if(!cur)return;
    state.leagueStageResults.push({round:cur.round,opp:cur.opp,myGoals:sp.myScore,oppGoals:sp.oppScore,isHome:cur.isHome});
    state.matchResults.push({stage:`小组赛第${cur.round}轮`,opp:cur.opp,myGoals:sp.myScore,oppGoals:sp.oppScore,isHome:cur.isHome});
    const g=state.groups[state.myGroupIdx];
    const myT=g.teams.find(t=>t.isMine);
    const oppT=g.teams.find(t=>t.id===cur.opp.id);
    if(myT&&oppT){
      if(cur.isHome)updateStandings(myT,oppT,sp.myScore,sp.oppScore);
      else updateStandings(oppT,myT,sp.oppScore,sp.myScore);
    }
    simulateRoundOthers(cur.round);
  }

  function playKnockoutMatch(){
    const stages=["16强","8强","半决赛","决赛"];

    const dm=DIFF_MUL[state.difficulty]||1;
    const oppStr=oo.str*dm*OPP_MUL*(STAGE_MUL[stage]||1);
    enterLineup(()=>kickoffKO(stage,oo,isF,isH,oppStr),{

  function proceedKnockout(){
    const stages=["16强","8强","半决赛","决赛"];
    const stage=stages[state.koStageIdx];
    const sp=state.player;
    const isF=stage==="决赛";
    const md=sp.matchData||{};
    if(isF){
      let won=false;
      if(md.pens) won=md.pens.my>md.pens.opp;
      else if(sp.myScore>sp.oppScore) won=true;
      else if(sp.myScore===sp.oppScore) won=Math.random()<0.5;
      if(md.pens&&md.pens.my!==md.pens.opp){
        // 点球决出的胜负，bracket 比分标注点球
        const mp0=myPairAtStage(stage);
        if(mp0)mp0.penalty=[md.pens.my,md.pens.opp];
      }
      resolveMyPair(stage,sp.myScore,sp.oppScore,won);
      if(won){state.champion=true;finalizeSeason(true)}
      else{if(!state.knockoutBracket)buildKnockoutBracket();simulateRestOfTournament();finalizeSeason(false)}
      return;
    }
    if(state.koLeg===1){
      state.koFirstLeg={myGoals:sp.myScore,oppGoals:sp.oppScore};
      const mp1=myPairAtStage(stage);
      if(mp1){
        mp1.a.matches=(mp1.a.matches||0)+1;mp1.b.matches=(mp1.b.matches||0)+1;
        if(!mp1.legs)mp1.legs=[];
        mp1.legs.push(mp1.a.isMine?[sp.myScore,sp.oppScore]:[sp.oppScore,sp.myScore]);
      }
      state.koLeg=2;
      playKnockoutMatch();
      return;
    }
    const fl=state.koFirstLeg;
    const tm=fl.myGoals+sp.myScore;const to=fl.oppGoals+sp.oppScore;
    let won;
    if(md.pens) won=md.pens.my>md.pens.opp;
    else if(tm>to) won=true;
    else if(tm<to) won=false;
    else won=Math.random()<0.5;
    if(md.pens){const mp0=myPairAtStage(stage);if(mp0)mp0.penalty=[md.pens.my,md.pens.opp]}
    resolveMyPair(stage,tm,to,won);
    const br=state.knockoutBracket;
    if(stage==="16强"){
      br.r16.forEach(p=>{
        if(p.winner)return;
        if(p.isMy){forfeitMyPair(p);return}
        const r=simOtherKnockoutMatch(p.a,p.b,false);
        p.score=[r.ga,r.gb];p.winner=r.winner;p.legs=r.legs;if(r.penalty)p.penalty=r.penalty;
      });
    } else if(stage==="8强"){
      br.qf.forEach(p=>{
        if(p.winner)return;
        if(p.isMy){forfeitMyPair(p);return}
        const r=simOtherKnockoutMatch(p.a,p.b,false);
        p.score=[r.ga,r.gb];p.winner=r.winner;p.legs=r.legs;if(r.penalty)p.penalty=r.penalty;
      });
    } else if(stage==="半决赛"){
      br.sf.forEach(p=>{
        if(p.winner)return;
        if(p.isMy){forfeitMyPair(p);return}
        const r=simOtherKnockoutMatch(p.a,p.b,false);
        p.score=[r.ga,r.gb];p.winner=r.winner;p.legs=r.legs;if(r.penalty)p.penalty=r.penalty;
      });
    }
    ensureBracketAdvanced();
    if(won){
      state.koStageIdx++;state.koLeg=1;state.koFirstLeg=null;
      playKnockoutMatch();
    }else{
      simulateRestOfTournament();
      finalizeSeason(false);
    }
  }
  function computeMVP(){
    const c={};
    state.myScorers.forEach(s=>{if(!c[s.name])c[s.name]={name:s.name,goals:0,assists:0,rating:0};c[s.name].goals=s.goals});
    state.myAssisters.forEach(a=>{if(!c[a.name])c[a.name]={name:a.name,goals:0,assists:0,rating:0};c[a.name].assists=a.assists});
    state.slots.filter(s=>s).forEach(p=>{if(!c[p.n])c[p.n]={name:p.n,goals:0,assists:0,rating:0};c[p.n].rating=p.r});
    let best=null,bs=-1;
    Object.values(c).forEach(x=>{const s=x.goals*3+x.assists*2+x.rating*0.5;if(s>bs){bs=s;best=x}});
    return best;
  }

                <span style="font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;background:${state.coach.tier===3?'var(--gold)':state.coach.tier===2?'var(--blue)':'#4a5a7e'};color:${state.coach.tier===3?'#2a1f00':state.coach.tier===2?'#08101f':'#c8d4e8'}">${state.coach.tier===1?'助教':state.coach.tier===2?'名帅':'大师'}</span>
                <b style="font-size:15px">👔 ${state.coach.name}</b>
                <span style="font-size:10px;color:var(--muted)">攻${state.coach.atk} 防${state.coach.def} 体${state.coach.fit} 临${state.coach.tac}</span>
                <span class="chip" style="font-size:9px;padding:2px 7px">${TRAIT_ICON[state.coach.trait]||'⭐'} ${state.coach.trait}${state.coach.tier===1?' 新锐版':''}</span>
              </div>
              <div style="font-size:11px;color:var(--muted);line-height:1.8">
                本季贡献：己方进球率 <b style="color:var(--green)">${coachAttackMul()>=1?'+':''}${((coachAttackMul()-1)*100).toFixed(1)}%</b>
                · 对方进球率 <b style="color:var(--blue)">${((coachDefenseMul()-1)*100).toFixed(1)}%</b>
                · 体力消耗 <b>×${coachWearMul().toFixed(2)}</b>
                · 加时进球 <b>×${coachETMul().toFixed(2)}</b>
                ${coachPenBonus()?`· 点球胜率 <b>${(50+coachPenBonus()*100).toFixed(0)}%</b>`:''}
                ${state.coach.trait==='轮换大师'?`· 换人名额 <b>${coachMaxSwaps()}</b>`:''}
                ${state.coach.trait==='伯乐'?`· 替补评分 <b>+${(coachBenchBonus()*100).toFixed(0)}%</b>`:''}
              </div>
            </div>`:''}
          </div>
        </div>
        <div class="rg-col">
          <div class="panel"><h2>🌟 我方赛季之星</h2>
            <div class="award-row award-row-3">
              <div class="award-box"><div class="icon">⭐</div><div class="label">队内 MVP</div><div class="val">${r.mvp?r.mvp.name:"—"}</div></div>
              <div class="award-box"><div class="icon">👟</div><div class="label">队内射手王</div><div class="val">${mySc?mySc.name+" ("+mySc.goals+"球)":"—"}</div></div>
              <div class="award-box"><div class="icon">🎯</div><div class="label">队内助攻王</div><div class="val">${myAs?myAs.name+" ("+myAs.assists+"助)":"—"}</div></div>
            </div>
            ${topLinks.length?`<div style="margin-top:8px">
              <div style="font-size:11px;color:var(--muted);margin-bottom:5px">🔗 最佳连线（助攻 → 进球）</div>
              ${topLinks.map(([k,v],i)=>{
                const [sc,as]=k.split("\u0000");
                const w=Math.round(v/ (topLinks[0][1]) *100);
                return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
                  <span style="font-size:10px;color:var(--gold);width:14px">${i+1}</span>
                  <div style="flex:1;height:16px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;position:relative">
                    <div style="width:${w}%;height:100%;background:linear-gradient(90deg,#00d4ff33,#00d4ff66)"></div>
                    <span style="position:absolute;left:6px;top:0;font-size:10px;line-height:16px;color:var(--text)">${as} → ${sc}</span>
                  </div>
                  <span style="font-size:11px;font-weight:800;color:var(--blue)">${v}</span>
                </div>`}).join("")}
            </div>`:'<div style="margin-top:8px;font-size:10px;color:#7b88a8">🔗 本季暂无连线数据</div>'}
          </div>
          ${br?renderBracket():''}
        </div>
        <div class="rg-col">
          <div class="panel"><h2>📋 赛季战绩</h2>
            <div class="rs-box">
            ${r.results.map(m=>{const cls=m.myGoals>m.oppGoals?"win":m.myGoals===m.oppGoals?"draw":"loss";
              let icon=m.myGoals>m.oppGoals?"✅":m.myGoals===m.oppGoals?"➖":"❌";
              if(m.pen){const pw=m.pen[0]>m.pen[1];icon=pw?"✅":"❌"}
              return `<div class="match-row ${m.pen?(m.pen[0]>m.pen[1]?"win":"loss"):cls}"><div><div class="match-stage">${m.stage}${m.et?' <span style="color:var(--yellow)">加时</span>':''}</div></div><div><div class="match-score">${icon} ${m.myGoals} - ${m.oppGoals} ${m.isHome?'(主)':'(客)'}${m.pen?` <span style="color:var(--blue);font-size:11px">点球 ${m.pen[0]}-${m.pen[1]}</span>`:''}</div><div class="match-opp">${clubBadge(m.opp.club,16)} ${m.opp.club}</div></div></div>`}).join("")}
            </div>
          </div>
          <div class="panel"><h2>📊 完整榜单</h2>
            <div class="rs-box">
            <div class="scorers">
              <div class="scorer-list"><h3>🥇 欧冠射手榜<span style="font-weight:400;color:#7b88a8"> · 场均=进球/球队已赛场次</span></h3>${r.allScorers.slice(0,10).map(s=>`<div class="scorer-row"><span class="scorer-name">${s.name}${s.team&&s.team!=="my"?' <span style="font-size:10px;color:#7b88a8">('+s.team+')</span>':''}</span><span class="scorer-val">${goalCell(s,tmmR)}</span></div>`).join("")||'<div style="color:#7b88a8;font-size:11px">暂无</div>'}</div>
              <div class="scorer-list"><h3>🎯 欧冠助攻榜</h3>${r.allAssisters.slice(0,10).map(s=>`<div class="scorer-row"><span class="scorer-name">${s.name}${s.team&&s.team!=="my"?' <span style="font-size:10px;color:#7b88a8">('+s.team+')</span>':''}</span><span class="scorer-val">${s.assists} 助</span></div>`).join("")||'<div style="color:#7b88a8;font-size:11px">暂无</div>'}</div>
            </div>
            </div>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" id="againBtn" style="margin-top:8px">再来一局</button>`;
    document.getElementById("againBtn").onclick=()=>{
      state.phase="start";state.slots=[];state.currentTeam=null;state.draftedTeams=[];state.usedPlayers=new Set();
      state.groups=[];state.myFixtures=[];state.leagueStageResults=[];state.otherRoundResults=[];
      state.matchResults=[];state.myScorers=[];state.myAssisters=[];state.allScorers=[];state.allAssisters=[];
      state.champion=false;state.eliminated=false;state.knockoutBracket=null;
      state.koStageIdx=0;state.koLeg=1;state.koFirstLeg=null;
      state.bench=[];state.stamina={};state.susp={};state.benchSkipped=false;state.lastLineupNote="";
    state.coach=null;state.coachCur=null;state.coachRound=1;state.coachSeen=[];
    state.reputeLeft=state.reputeBudget||130;state.reputeSpent=0;state.coachShop=[];
      state.lastMatchPenalty=null;state.knockoutOppStr=null;state.linkup={};state.groupViewIdx=0;state.scoreTab="team";
      render();
    };
  }

  render();
}
